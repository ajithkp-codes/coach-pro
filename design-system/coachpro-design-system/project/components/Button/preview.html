<!-- @dsCard group="Actions" height=260 -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  body { margin: 0; font-family: var(--font-sans); }
  .panes { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border); min-height: 260px; }
  .pane { background: var(--bg); padding: 26px; display: flex; flex-direction: column; gap: 16px; }
  .kick { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-faint); }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  @media (max-width: 560px){ .panes{ grid-template-columns: 1fr; } }
</style>
<div id="root" class="cp-root"></div>
<script>
  var CP = window.CoachPro, h = React.createElement;
  function Pane(theme, label) {
    return h("div", { className: "pane", "data-theme": theme, key: theme },
      h("span", { className: "kick" }, label),
      h("div", { className: "row" },
        h(CP.Button, { variant: "primary", iconLeft: CP.Icon.plus("p") }, "Add client"),
        h(CP.Button, { variant: "secondary" }, "Assign program"),
        h(CP.Button, { variant: "ghost" }, "Cancel")),
      h("div", { className: "row" },
        h(CP.Button, { variant: "primary", size: "sm" }, "Small"),
        h(CP.Button, { variant: "primary", size: "md" }, "Medium"),
        h(CP.Button, { variant: "primary", size: "lg" }, "Large")),
      h("div", { className: "row" },
        h(CP.Button, { variant: "danger" }, "Remove"),
        h(CP.Button, { variant: "primary", disabled: true }, "Disabled")));
  }
  ReactDOM.createRoot(document.getElementById("root")).render(
    h("div", { className: "panes" }, Pane("light", "Light"), Pane("dark", "Dark")));
</script>
