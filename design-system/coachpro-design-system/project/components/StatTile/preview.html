<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  body { margin: 0; font-family: var(--font-sans); }
  .panes { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border); min-height: 220px; }
  .pane { background: var(--bg); padding: 24px; display: flex; flex-direction: column; gap: 14px; }
  .kick { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-faint); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 18px 20px; box-shadow: var(--shadow-sm); }
  @media (max-width: 560px){ .panes{ grid-template-columns: 1fr; } }
</style>
<div id="root" class="cp-root"></div>
<script>
  var CP = window.CoachPro, h = React.createElement;
  function Box(props){ return h("div",{className:"box"}, h(CP.StatTile, props)); }
  function Pane(theme, label) {
    return h("div", { className: "pane", "data-theme": theme, key: theme },
      h("span", { className: "kick" }, label),
      h("div", { className: "grid" },
        h(Box, { label: "Active clients", value: "48", delta: "+5", trend: "up", caption: "vs last month" }),
        h(Box, { label: "Avg adherence", value: "87", unit: "%", delta: "+2.4%", trend: "up", caption: "last 7 days" }),
        h(Box, { label: "Sessions logged", value: "312", delta: "-8", trend: "down", caption: "this week" }),
        h(Box, { label: "At-risk clients", value: "6", delta: "0", trend: "flat", caption: "needs outreach" })));
  }
  ReactDOM.createRoot(document.getElementById("root")).render(
    h("div", { className: "panes" }, Pane("light", "Light"), Pane("dark", "Dark")));
</script>
